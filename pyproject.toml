[project]
name = "kupuna-bench"
version = "0.1.0"
description = "KŪPUNA-AI Bench: measuring overrefusal and harmful compliance in AI conversations with older adults"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Jeremy Gracey", email = "jeremy.a.gracey@gmail.com" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "httpx>=0.27",
  "typer>=0.12",
  "markdown>=3.10.3",
]

[project.scripts]
kupuna-bench = "kupuna_bench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-PyYAML",
    "types-markdown>=3.10.2.20260712",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
